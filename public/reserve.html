<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPOT. — бронь столика</title>
<meta name="description" content="Бронирование столика в руфтоп-кинобаре SPOT. в Батуми.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0B0B0B; --card:#151312; --card-2:#1D1A18; --rule:#2A2724;
    --text:#F4F1EC; --muted:#8B857D; --accent:#E75228;
    --free:#4CAF50; --busy:#F44336;
    --display:'Oswald','Noto Sans Georgian',sans-serif;
    --body:'Noto Sans','Noto Sans Georgian',sans-serif;
    --pad:clamp(16px,4.5vw,32px); --hh:56px; --r:14px;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:var(--body); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    padding-bottom:calc(90px + env(safe-area-inset-bottom));
  }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{transition-duration:.01ms!important;animation-duration:.01ms!important} }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  img{ display:block; max-width:100%; }
  button{ font-family:inherit; }
  .wrap{ max-width:840px; margin:0 auto; padding-inline:var(--pad); }

  header.top{ position:sticky; top:0; z-index:30; background:rgba(11,11,11,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--rule); }
  .top__row{ display:flex; align-items:center; gap:12px; padding:11px 0 11px 4px; }
  .top__logo{ height:26px; width:auto; margin-right:auto; filter:invert(1) hue-rotate(180deg); }
  .langs{ display:flex; gap:2px; margin-left:auto; }
  .langs button{ font-size:13px; color:var(--muted); background:none; border:1px solid transparent; border-radius:999px; padding:7px 12px; cursor:pointer; min-height:36px; }
  .langs button[aria-pressed="true"]{ color:var(--accent); border-color:var(--accent); }

  h1.page{ font-family:var(--display); font-weight:500; font-size:clamp(26px,7vw,44px); line-height:1.02; letter-spacing:.03em; text-transform:uppercase; margin:clamp(22px,5vw,40px) 0 6px; }
  .lead{ color:var(--muted); font-size:14px; margin:0 0 clamp(18px,4vw,28px); }

  /* афиша сеанса */
  .ev{ display:grid; grid-template-columns:96px 1fr; gap:14px; background:var(--card); border-radius:var(--r); padding:14px; margin-bottom:18px; }
  .ev img{ width:96px; aspect-ratio:2/3; object-fit:cover; object-position:center top; border-radius:9px; background:var(--card-2); }
  .ev__t{ font-family:var(--display); font-size:19px; letter-spacing:.03em; text-transform:uppercase; margin:0 0 6px; }
  .ev__m{ color:var(--muted); font-size:13.5px; margin:0 0 4px; }
  .ev__p{ font-family:var(--display); font-size:17px; letter-spacing:.03em; }
  .ev__note{ color:var(--muted); font-size:12.5px; margin-top:8px; white-space:pre-line; }
  @media (max-width:520px){ .ev{ grid-template-columns:72px 1fr; gap:11px; padding:11px } .ev img{ width:72px } .ev__t{ font-size:16px } }

  .fld{ margin-bottom:14px; }
  .fld label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  .fld input, .fld select, .fld textarea{
    width:100%; padding:13px; font-size:16px; font-family:var(--body);
    color:var(--text); background:var(--card); border:1px solid var(--rule); border-radius:10px;
  }
  .fld input.bad{ border-color:var(--accent); }
  .fld .hint{ font-size:12px; color:var(--muted); margin-top:6px; }
  .two{ display:flex; gap:10px; } .two > *{ flex:1; min-width:0; }
  @media (max-width:480px){ .two{ flex-direction:column; gap:0 } }

  /* схема зала: рисуется по плану из админки и масштабируется под экран */
  .hall{ background:var(--card); border-radius:var(--r); padding:14px; margin-bottom:16px; }
  .hall__legend{ display:flex; gap:14px; font-size:12px; color:var(--muted); margin-bottom:12px; flex-wrap:wrap; }
  .hall__legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:-1px; }
  .plan{ position:relative; width:100%; }
  .plan__in{ position:relative; transform-origin:top left; }
  .plan__screen{
    position:absolute; left:50%; transform:translateX(-50%); top:8px;
    font-family:var(--display); font-size:11px; letter-spacing:.3em; color:var(--muted);
    border:1px solid var(--rule); border-radius:8px; padding:6px 30px; pointer-events:none;
  }
  .pt{
    position:absolute; box-sizing:border-box; cursor:pointer; padding:2px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:var(--display); font-size:13px; letter-spacing:.02em; line-height:1.1;
    background:var(--card-2); color:var(--text); border:1px solid var(--rule);
    transition:border-color .15s, background .15s;
  }
  .pt small{ display:block; font-family:var(--body); font-size:9.5px; color:var(--muted); letter-spacing:0; }
  .pt.free{ border-color:rgba(76,175,80,.55); }
  @media (hover:hover){ .pt.free:hover{ background:rgba(76,175,80,.14); } }
  .pt.busy{ border-color:rgba(244,67,54,.35); color:var(--muted); opacity:.5; cursor:not-allowed; }
  .pt.small{ opacity:.35; cursor:not-allowed; }
  .pt.picked{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .pt.picked small{ color:rgba(255,255,255,.85); }

  .sum{ position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(11,11,11,.97); backdrop-filter:blur(12px); border-top:1px solid var(--rule); padding:11px 0 calc(13px + env(safe-area-inset-bottom)); }
  .sum__row{ display:flex; align-items:center; gap:12px; }
  .sum__s{ flex:1; min-width:0; font-size:12.5px; color:var(--muted); }
  .sum__s b{ display:block; color:var(--text); font-family:var(--display); font-size:19px; letter-spacing:.04em; }
  .btn{ font-family:var(--display); font-weight:500; font-size:15px; letter-spacing:.07em; text-transform:uppercase; color:#fff; background:var(--accent); border:none; border-radius:11px; padding:14px 24px; cursor:pointer; min-height:48px; }
  .btn:disabled{ opacity:.45; cursor:default; }

  .msg{ margin:12px 0; padding:12px 14px; border-radius:10px; font-size:14px; display:none; }
  .msg.ok{ display:block; background:#10251a; border:1px solid #1f5136; color:#8ee0ae; }
  .msg.err{ display:block; background:#2a1412; border:1px solid #5a241d; color:#f0a49a; }
  .note{ color:var(--muted); font-size:15px; padding:44px 0; }
  footer.foot{ margin-top:44px; padding:24px 0 40px; border-top:1px solid var(--rule); color:var(--muted); font-size:13px; }
  footer.foot a{ color:var(--text); text-decoration:none; border-bottom:1px solid var(--rule); }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top__row">
    <a href="/" aria-label="SPOT."><img class="top__logo" src="/logo.png" alt="SPOT."></a>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
  </div>
</header>

<main class="wrap">
  <h1 class="page" id="h-title"></h1>
  <p class="lead" id="h-lead"></p>

  <div id="ev"></div>

  <div id="picker" style="display:none">
    <div class="two">
      <div class="fld"><label id="l-date"></label><select id="f-date"></select></div>
      <div class="fld"><label id="l-time"></label><select id="f-time"></select></div>
    </div>
  </div>

  <div class="fld"><label id="l-guests"></label><select id="f-guests"></select></div>

  <div class="hall">
    <div class="hall__legend">
      <span><i style="background:var(--free)"></i><span id="lg-free"></span></span>
      <span><i style="background:var(--busy)"></i><span id="lg-busy"></span></span>
      <span><i style="background:var(--accent)"></i><span id="lg-pick"></span></span>
    </div>
    <div class="plan" id="plan"><div class="plan__in" id="plan-in"></div></div>
    <div class="hint" id="seat-hint" style="font-size:12px;color:var(--muted);margin-top:10px"></div>
  </div>

  <div class="two">
    <div class="fld"><label id="l-name"></label><input id="f-name" autocomplete="name"></div>
    <div class="fld"><label id="l-phone"></label><input id="f-phone" inputmode="tel" autocomplete="tel" placeholder="+995 …"><div class="hint" id="phone-hint"></div></div>
  </div>
  <div class="fld"><label id="l-insta"></label><input id="f-insta" placeholder="@nickname" autocomplete="off"></div>
  <div class="fld"><label id="l-comment"></label><textarea id="f-comment" rows="2"></textarea></div>

  <div class="msg" id="msg"></div>
</main>

<footer class="foot">
  <div class="wrap">
    <div id="foot-addr"></div>
    <p style="margin:10px 0 0">
      <a href="/menu">Меню</a> ·
      <a href="https://wa.me/995555248432" target="_blank" rel="noopener">WhatsApp</a> ·
      <a href="https://www.instagram.com/spot.rooftop" target="_blank" rel="noopener">Instagram</a>
    </p>
  </div>
</footer>

<div class="sum">
  <div class="wrap sum__row">
    <div class="sum__s" id="sum"></div>
    <button class="btn" id="pay"></button>
  </div>
</div>

<script>
(() => {
  const LANGS=[{c:'ka',l:'ქარ'},{c:'ru',l:'рус'},{c:'en',l:'eng'}];
  const MAX_GUESTS=8;

  const T={
    ru:{ title:'Бронь столика', lead:'Выберите сеанс, столик и оставьте контакты — депозит оплачивается онлайн.',
         date:'Дата', time:'Сеанс', guests:'Гостей', name:'Ваше имя', phone:'Телефон',
         insta:'Instagram (необязательно)', comment:'Комментарий',
         free:'свободно', busy:'занято', closed:'закрыт', pick:'ваш выбор',
         pickSeat:'Выберите столик на схеме.', seatTaken:'Этот столик уже занят на этот сеанс.',
         chosen:t=>'Выбран '+t, deposit:'Депозит', total:'Итого', pay:'Оплатить',
         perGuest:'за гостя', perGuestDep:'за гостя', perGuestInc:'за гостя', noSessions:'Ближайших сеансов пока нет. Загляните позже или напишите нам.',
         loading:'Загружаем…', fail:'Что-то пошло не так. Попробуйте ещё раз.',
         needName:'Введите имя.', needPhone:'Введите номер телефона.',
         badPhone:'Похоже, это не номер. Инстаграм — в отдельное поле ниже.',
         needSeat:'Выберите столик.', going:'Переходим к оплате…',
         addr:'ул. Реджеба Ниджарадзе, 18, Батуми', gel:'GEL' },
    ka:{ title:'მაგიდის დაჯავშნა', lead:'აირჩიეთ სეანსი, მაგიდა და დატოვეთ კონტაქტი — დეპოზიტი ონლაინ იხდება.',
         date:'თარიღი', time:'სეანსი', guests:'სტუმრები', name:'თქვენი სახელი', phone:'ტელეფონი',
         insta:'Instagram (არასავალდებულო)', comment:'კომენტარი',
         free:'თავისუფალია', busy:'დაკავებულია', closed:'დაკეტილია', pick:'თქვენი არჩევანი',
         pickSeat:'აირჩიეთ მაგიდა სქემაზე.', seatTaken:'ეს მაგიდა უკვე დაკავებულია.',
         chosen:t=>'არჩეულია '+t, deposit:'დეპოზიტი', total:'ჯამში', pay:'გადახდა',
         perGuest:'ერთ სტუმარზე', perGuestDep:'ერთ სტუმარზე', perGuestInc:'ერთ სტუმარზე', noSessions:'უახლოესი სეანსები ჯერ არ არის. შემოგვიარეთ მოგვიანებით.',
         loading:'იტვირთება…', fail:'რაღაც შეცდომაა. სცადეთ ხელახლა.',
         needName:'შეიყვანეთ სახელი.', needPhone:'შეიყვანეთ ტელეფონის ნომერი.',
         badPhone:'ეს ნომერს არ ჰგავს. ინსტაგრამი — ცალკე ველში.',
         needSeat:'აირჩიეთ მაგიდა.', going:'გადავდივართ გადახდაზე…',
         addr:'რეჯებ ნიჟარაძის 18, ბათუმი', gel:'GEL' },
    en:{ title:'Book a table', lead:'Pick a screening and a table, leave your contacts — the deposit is paid online.',
         date:'Date', time:'Screening', guests:'Guests', name:'Your name', phone:'Phone',
         insta:'Instagram (optional)', comment:'Comment',
         free:'free', busy:'taken', closed:'closed', pick:'your pick',
         pickSeat:'Pick a table on the plan.', seatTaken:'That table is already taken for this screening.',
         chosen:t=>t+' selected', deposit:'Deposit', total:'Total', pay:'Pay',
         perGuest:'per guest', perGuestDep:'per guest', perGuestInc:'per guest', noSessions:'No upcoming screenings yet. Check back later or message us.',
         loading:'Loading…', fail:'Something went wrong. Please try again.',
         needName:'Enter your name.', needPhone:'Enter your phone number.',
         badPhone:"That doesn't look like a number. Instagram goes in the field below.",
         needSeat:'Pick a table.', going:'Taking you to payment…',
         addr:'18 Rejeb Nijaradze, Batumi', gel:'GEL' }
  };

  // Цена значит разное в зависимости от формата: у обычного показа и
  // à la carte это депозит, у киноужина и drinking night — всё включено.
  const INCLUDED_FORMATS = ['din','drink'];
  function priceNote(fmt){
    const t=T[lang];
    return INCLUDED_FORMATS.indexOf(fmt)!==-1 ? t.perGuestInc : t.perGuestDep;
  }

  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // Та же проверка, что на сервере: телефон должен быть телефоном,
  // инстаграм-ник в это поле больше не проходит.
  function looksLikePhone(v){
    const s=String(v||'').trim();
    if(!s || s.startsWith('@')) return false;
    if(/[a-zA-Zа-яА-Я]/.test(s.replace(/^\+/,''))) return false;
    let d=s.replace(/\D/g,'');
    if(d.length===11 && d[0]==='8') d='7'+d.slice(1);
    if(d.length===9 && d[0]==='5') d='995'+d;
    return d.length>=10 && d.length<=15;
  }

  let lang=(()=>{
    const u=new URL(location.href).searchParams.get('lang');
    if(LANGS.some(l=>l.c===u)) return u;
    try{ const s=localStorage.getItem('spot_lang'); if(LANGS.some(l=>l.c===s)) return s; }catch{}
    const n=(navigator.language||'ru').slice(0,2);
    return LANGS.some(l=>l.c===n)?n:'ru';
  })();

  let SESSIONS=[];      // список ближайших (режим выбора)
  let session=null;     // активный сеанс
  let booked=new Set();
  let seat=null;
  let guests=2;

  function renderLangs(){
    $('langs').innerHTML=LANGS.map(l=>'<button type="button" data-l="'+l.c+'" aria-pressed="'+(l.c===lang)+'">'+l.l+'</button>').join('');
    $('langs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      lang=b.dataset.l;
      try{ localStorage.setItem('spot_lang',lang); }catch{}
      const u=new URL(location.href); u.searchParams.set('lang',lang); history.replaceState(null,'',u);
      renderLangs(); applyStatic(); renderEvent(); renderSeats();
    });
  }

  function applyStatic(){
    const t=T[lang];
    document.documentElement.lang=lang;
    document.title='SPOT. — '+t.title;
    $('h-title').textContent=t.title;
    $('h-lead').textContent=t.lead;
    $('l-date').textContent=t.date; $('l-time').textContent=t.time;
    $('l-guests').textContent=t.guests; $('l-name').textContent=t.name;
    $('l-phone').textContent=t.phone; $('l-insta').textContent=t.insta;
    $('l-comment').textContent=t.comment;
    $('lg-free').textContent=t.free; $('lg-busy').textContent=t.busy; $('lg-pick').textContent=t.pick;
    $('foot-addr').textContent=t.addr;
    $('pay').textContent=t.pay;
    renderGuests(); renderSum();
  }

  function renderGuests(){
    const cur=guests;
    $('f-guests').innerHTML=Array.from({length:MAX_GUESTS},(_,i)=>i+1)
      .map(n=>'<option value="'+n+'"'+(n===cur?' selected':'')+'>'+n+'</option>').join('');
  }
  $('f-guests').addEventListener('change',()=>{
    guests=Number($('f-guests').value)||1;
    // Стол мог стать недоступным при уменьшении числа гостей
    // Стол мог стать недоступным при смене числа гостей — снимаем выбор.
    if(seat && PLAN){
      const p=PLAN.tables.find(x=>x.label===seat);
      if(p && (guests < (Number(p.capacity_min)||1) || guests > (Number(p.capacity_max)||99))) seat=null;
    }
    renderSeats(); renderSum();
  });


  function renderEvent(){
    const t=T[lang];
    if(!session){ $('ev').innerHTML=''; return; }
    $('ev').innerHTML=
      '<div class="ev">'+
        (session.poster_url?'<img src="'+esc(session.poster_url)+'" alt="">':'<img alt="">')+
        '<div>'+
          '<h2 class="ev__t">'+esc(session.title)+'</h2>'+
          '<p class="ev__m">'+esc(session.date)+' · '+esc(session.time)+'</p>'+
          '<div class="ev__p">'+esc(String(session.price))+' '+esc(t.gel)+' <span style="font-size:12px;color:var(--muted)">'+esc(priceNote(session.format))+'</span></div>'+
          (session.deposit_text?'<div class="ev__note">'+esc(session.deposit_text)+'</div>':'')+
        '</div>'+
      '</div>';
  }

  // Схема зала берётся из плана, нарисованного в админке. Холст задан в
  // условных единицах, а здесь масштабируется под ширину экрана — поэтому
  // одна и та же расстановка одинаково читается на телефоне и на десктопе.
  let PLAN = null;

  // sessionId важнее eventId: рассадка может быть задана на один сеанс —
  // тогда общий план события показывать нельзя, гость выберет стол, которого
  // сегодня физически нет там, где нарисовано.
  async function loadPlan(eventId, sessionId){
    try{
      const qs = [];
      if(sessionId) qs.push('session_id='+encodeURIComponent(sessionId));
      if(eventId) qs.push('event_id='+encodeURIComponent(eventId));
      const url = '/api/floor-plan' + (qs.length ? ('?'+qs.join('&')) : '');
      const r = await fetch(url);
      const d = await r.json();
      if(d && d.ok) PLAN = d;
    }catch(e){ PLAN = null; }
  }

  function fitPlan(){
    if(!PLAN) return;
    const box = $('plan');
    const W = Number(PLAN.settings.canvas_w) || 1000;
    const H = Number(PLAN.settings.canvas_h) || 700;
    const scale = Math.min(1, box.clientWidth / W);
    const inner = $('plan-in');
    inner.style.width = W + 'px';
    inner.style.height = H + 'px';
    inner.style.transform = 'scale(' + scale + ')';
    box.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', fitPlan);

  function renderSeats(){
    const t=T[lang];
    if(!PLAN || !PLAN.tables || !PLAN.tables.length){
      $('plan-in').innerHTML='';
      $('seat-hint').textContent=t.pickSeat;
      return;
    }

    $('plan-in').innerHTML =
      '<div class="plan__screen">'+esc(PLAN.settings.screen_label||'SCREEN')+'</div>'+
      PLAN.tables.map(p=>{
        const isBusy = booked.has(String(p.label).toLowerCase());
        const isClosed = p.bookable === false;   // закрыт администратором
        const tooSmall = guests < (Number(p.capacity_min)||1) || guests > (Number(p.capacity_max)||99);
        const cls = isClosed ? 'busy' : (isBusy ? 'busy' : (tooSmall ? 'small' : 'free'));
        const picked = (seat===p.label) ? ' picked' : '';
        const style = 'left:'+p.x+'px;top:'+p.y+'px;width:'+p.w+'px;height:'+p.h+'px;'+
          'border-radius:'+(p.shape==='circle'?'50%':'10px')+';'+
          (p.rotation?('transform:rotate('+p.rotation+'deg);'):'');
        const note = isClosed ? t.closed : (isBusy ? t.busy : (tooSmall ? (p.capacity_min+'–'+p.capacity_max) : ''));
        return '<button type="button" class="pt '+cls+picked+'" data-seat="'+esc(p.label)+'" style="'+style+'"'+
          ((isClosed||isBusy||tooSmall)?' disabled':'')+'>'+
          '<span>'+esc(String(p.label).replace('Стол ','').replace('Бар ','B'))+
          (note?'<small>'+esc(note)+'</small>':'')+'</span></button>';
      }).join('');

    fitPlan();
    $('seat-hint').textContent = seat ? t.chosen(seat) : t.pickSeat;

    $('plan-in').querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{
      seat=b.dataset.seat; renderSeats(); renderSum();
    });
  }

  function renderSum(){
    const t=T[lang];
    const total=session ? Number(session.price)*guests : 0;
    const label = session && INCLUDED_FORMATS.indexOf(session.format)!==-1 ? t.total : t.deposit;
    $('sum').innerHTML=esc(label)+' · '+guests+' × '+(session?session.price:0)+
      '<b>'+total+' '+esc(t.gel)+'</b>';
    $('pay').disabled=!session;
  }

  async function loadAvailability(){
    booked=new Set(); seat=null;
    if(!session) { renderSeats(); return; }
    try{
      const r=await fetch('/api/availability?session_id='+encodeURIComponent(session.session_id||session.id));
      const d=await r.json();
      // unavailable = занятые + закрытые под этот показ
      const un = d.unavailable || (d.booked||[]);
      booked=new Set(un.map(x=>String(x).trim().toLowerCase()));
    }catch(e){}
    renderSeats();
  }

  // Режим 1: пришли по прямой ссылке на сеанс
  async function loadFromLink(sid){
    const r=await fetch('/api/session-info?session_id='+encodeURIComponent(sid));
    const d=await r.json();
    if(!r.ok||!d.ok) throw new Error('no session');
    session={ session_id:d.session_id, event_id:d.event_id, title:d.title, date:d.date, time:d.time,
              price:d.price, poster_url:d.poster_url, deposit_text:d.deposit_text, format:d.format };
    await loadPlan(session.event_id, session.session_id||session.id);
    renderEvent(); renderSum(); await loadAvailability();
  }

  // Режим 2: выбираем из ближайших сеансов
  async function loadPicker(){
    const t=T[lang];
    const r=await fetch('/api/upcoming-sessions');
    const d=await r.json();
    SESSIONS=d.sessions||[];
    if(!SESSIONS.length){ $('ev').innerHTML='<div class="note">'+esc(t.noSessions)+'</div>'; return; }

    $('picker').style.display='';
    const dates=[...new Set(SESSIONS.map(s=>s.date))];
    $('f-date').innerHTML=dates.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');

    const fillTimes=()=>{
      const day=SESSIONS.filter(s=>s.date===$('f-date').value);
      $('f-time').innerHTML=day.map(s=>'<option value="'+esc(s.session_id)+'">'+esc(s.time)+' · '+esc(s.title)+'</option>').join('');
      pick();
    };
    const pick=async ()=>{
      const s=SESSIONS.find(x=>x.session_id===$('f-time').value);
      if(!s) return;
      session=s;
      await loadPlan(session.event_id, session.session_id||session.id);
      renderEvent(); renderSum(); await loadAvailability();
    };
    $('f-date').addEventListener('change', fillTimes);
    $('f-time').addEventListener('change', pick);
    fillTimes();
  }

  async function boot(){
    const t=T[lang];
    $('ev').innerHTML='<div class="note">'+esc(t.loading)+'</div>';
    await loadPlan(); // общий план для первой отрисовки, до выбора события
    const sid=new URL(location.href).searchParams.get('session_id');
    try{
      if(sid) await loadFromLink(sid);
      else await loadPicker();
    }catch(e){
      // Ссылка на несуществующий сеанс — не тупик: предлагаем выбрать другой.
      try{ await loadPicker(); }
      catch(_){ $('ev').innerHTML='<div class="note">'+esc(t.fail)+'</div>'; }
    }
    renderSeats();
  }

  $('f-phone').addEventListener('input',()=>{
    const v=$('f-phone').value.trim();
    $('f-phone').classList.toggle('bad', !!v && !looksLikePhone(v));
    $('phone-hint').textContent = (v && !looksLikePhone(v)) ? T[lang].badPhone : '';
  });

  $('pay').onclick=async ()=>{
    const t=T[lang], m=$('msg');
    m.className='msg';
    if(!session) return;

    const name=$('f-name').value.trim();
    const phone=$('f-phone').value.trim();
    if(!name){ m.textContent=t.needName; m.className='msg err'; $('f-name').focus(); return; }
    if(!phone){ m.textContent=t.needPhone; m.className='msg err'; $('f-phone').focus(); return; }
    if(!looksLikePhone(phone)){ m.textContent=t.badPhone; m.className='msg err'; $('f-phone').focus(); return; }
    if(!seat){ m.textContent=t.needSeat; m.className='msg err'; window.scrollTo({top:$('plan').offsetTop-120,behavior:'smooth'}); return; }

    $('pay').disabled=true; m.textContent=t.going; m.className='msg ok';
    try{
      const r=await fetch('/api/payment',{ method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          session_id: session.session_id||session.id,
          customer_name:name, customer_phone:phone,
          customer_instagram:$('f-insta').value.trim(),
          table_no:seat, guests:String(guests),
          comment:$('f-comment').value.trim(),
          tilda_page:location.href
        })});
      const d=await r.json().catch(()=>({}));
      if(!r.ok || !d.redirect_url){
        m.textContent=d.detail||d.error||t.fail; m.className='msg err';
        $('pay').disabled=false;
        return;
      }
      location.href=d.redirect_url;
    }catch(e){
      m.textContent=t.fail; m.className='msg err'; $('pay').disabled=false;
    }
  };

  renderLangs(); applyStatic(); boot();
})();
</script>
</body>
</html>
